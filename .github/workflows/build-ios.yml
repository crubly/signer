name: Build iOS Client

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download IDevice.xcframework
        run: |
          mkdir -p frontend/Frameworks
          curl -fsSL https://github.com/jkcoxson/idevice/releases/download/v0.1.68/idevice-xcframework-v0.1.68.zip -o "$RUNNER_TEMP/idevice.zip"
          unzip -q "$RUNNER_TEMP/idevice.zip" "swift/IDevice.xcframework/*" -d "$RUNNER_TEMP/idevice_extract"
          mv "$RUNNER_TEMP/idevice_extract/swift/IDevice.xcframework" frontend/Frameworks/IDevice.xcframework

      - name: Generate Xcode Project
        working-directory: frontend
        run: xcodegen generate

      - name: Build Unsigned Archive
        working-directory: frontend
        run: |
          xcodebuild -project Signer.xcodeproj \
            -scheme Signer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Signed.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$RUNNER_TEMP/Signed.xcarchive/Products/Applications/Signed.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/Signed.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-iOS-IPA
          path: ${{ runner.temp }}/Signed.ipa

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signed iOS Build #${{ github.run_number }}
          files: ${{ runner.temp }}/Signed.ipa
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
