name: Signer
options:
  bundleIdPrefix: com.crubly
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  Signer:
    type: application
    platform: iOS
    sources:
      - path: Signer
    info:
      path: Signer/Info.plist
      properties:
        CFBundleDisplayName: Signed
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.crubly.signed.refresh
        UIBackgroundModes:
          - fetch
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - signer
            CFBundleURLName: com.crubly.signed
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: Signed
        PRODUCT_BUNDLE_IDENTIFIER: com.crubly.signed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
